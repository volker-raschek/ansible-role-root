name: Ansible Linter

on:
  pull_request:
    types: [ "opened", "reopened", "synchronize" ]
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]

jobs:
  ansible-lint:
    runs-on:
    - ubuntu-latest
    steps:
    - uses: actions/checkout@v5.0.0
    - name: Run ansible-lint
      uses: ansible/ansible-lint@v25.2.1
      with:
        args: "--config-file .ansible-lint.yml"
        # The molecule scenario is linted as well, so its collections are required beside the ones of the role.
        requirements_file: "molecule/default/collections.yml"
        setup_python: "true"
